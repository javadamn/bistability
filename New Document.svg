# Market snapshot: Sellers and privacy blur

**Purpose:** single-panel vector schematic showing how user data flows into a marketplace and how a privacy mechanism ("blur") protects data before sellers see it.

---

### Diagram (SVG)

```svg
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Data owners cluster -->
  <g id="owners">
    <text x="40" y="40" font-size="18" font-weight="700">Data owners / Users</text>
    <g transform="translate(40,60)">
      <circle cx="40" cy="40" r="26" fill="#E8F4FF" stroke="#6EA8FF"/>
      <circle cx="110" cy="30" r="26" fill="#E8FFF2" stroke="#4DBE86"/>
      <circle cx="70" cy="95" r="26" fill="#FFF4E6" stroke="#FFB059"/>
      <text x="0" y="150" font-size="12" fill="#444">(individual-level)</text>
    </g>
  </g>

  <!-- Arrow to Collector -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
  </defs>
  <line x1="200" y1="120" x2="360" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="230" y="110" font-size="12">collect</text>

  <!-- Collector / Platform box -->
  <g id="collector">
    <rect x="360" y="40" width="240" height="160" rx="12" fill="#F4F8FF" stroke="#7A9CFF" />
    <text x="430" y="80" font-size="16" font-weight="700">Data Collector / Platform</text>
    <text x="380" y="110" font-size="12">aggregates, preprocesses, and stores</text>
  </g>

  <!-- Privacy mechanism (blur) -->
  <g id="privacy">
    <rect x="630" y="30" width="300" height="190" rx="12" fill="#FFF9F0" stroke="#FFBD6E" />
    <text x="780" y="70" font-size="16" font-weight="700">Privacy Mechanism</text>
    <text x="650" y="100" font-size="12">(Blur / Transform / Differential Privacy)</text>

    <!-- Example blur icons -->
    <g transform="translate(660,120)">
      <rect x="0" y="0" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#E6B07A"/>
      <text x="10" y="25" font-size="10">Noise add (DP)</text>
      <rect x="110" y="0" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#E6B07A"/>
      <text x="120" y="25" font-size="10">Aggregation</text>
      <rect x="220" y="0" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#E6B07A"/>
      <text x="230" y="25" font-size="10">K-anonymize</text>
    </g>
  </g>

  <!-- Arrow to Market / Dataset product -->
  <line x1="930" y1="120" x2="1050" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="950" y="110" font-size="12">release / expose</text>

  <!-- Market / Dataset product box -->
  <g id="market">
    <rect x="1050" y="20" width="0" height="0" fill="none" />
  </g>

  <!-- Sellers cluster (buyers) -->
  <g id="sellers">
    <text x="40" y="260" font-size="18" font-weight="700">Sellers / Buyers in Market</text>
    <g transform="translate(40,280)">
      <rect x="0" y="0" width="220" height="110" rx="10" fill="#F0F6FF" stroke="#7A9CFF" />
      <text x="12" y="25" font-size="13" font-weight="600">Seller A</text>
      <text x="12" y="45" font-size="11">- model training</text>
      <text x="12" y="65" font-size="13" font-weight="600">Seller B</text>
      <text x="12" y="85" font-size="11">- analytics / insights</text>
    </g>
  </g>

  <!-- Arrows from Privacy to Sellers -->
  <line x1="780" y1="220" x2="220" y2="310" stroke="#888" stroke-dasharray="6,6" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="900" y1="220" x2="300" y2="310" stroke="#888" stroke-dasharray="6,6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="520" y="240" font-size="11" fill="#666">dataset (blurred / privatized)</text>

  <!-- Attack / leakage arrow (dotted) -->
  <line x1="240" y1="200" x2="580" y2="160" stroke="#C33" stroke-dasharray="4,6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="260" y="190" font-size="11" fill="#C33">re-identification risk</text>

  <!-- Legend -->
  <g transform="translate(40,420)">
    <rect x="0" y="0" width="360" height="120" rx="8" fill="#FAFAFA" stroke="#DDD" />
    <text x="12" y="22" font-size="14" font-weight="700">Legend</text>
    <text x="12" y="44" font-size="12">• Solid arrows: data flow</text>
    <text x="12" y="64" font-size="12">• Dashed arrows: privatized dataset exposure</text>
    <text x="12" y="84" font-size="12">• Dotted red: privacy attack / leakage</text>
  </g>

  <!-- Caption -->
  <text x="420" y="560" font-size="12" fill="#333">Figure: Users' raw data are collected by a platform, passed through a privacy mechanism (e.g., aggregation, noise addition / differential privacy, k-anonymity) which "blurs" identifying information, and then exposed as a product to sellers in the market. Re-identification attacks represent residual risk.</text>
</svg>
```

---

### Notes for use

* **Export:** copy the SVG code above into an `.svg` file and open in any vector editor (Illustrator, Inkscape). You can edit colors, labels, sizes.
* **Variants:** create a 2-row layout that separates legitimate buyers (analytics firms) from malicious actors (adversarial buyers) and show different permissions (query-limited vs. direct dataset download).
* **Suggested caption:** "Platform applies privacy-preserving transformations (e.g., differential privacy, aggregation, k-anonymity) to user-level data before offering a dataset or query access to sellers — reducing identifiability while retaining analytic utility. Residual re-identification risk remains and depends on mechanism parameters."

